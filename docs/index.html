<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мой трекер</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./styles.css"></head>
<body><main><header><p class="eyebrow">ЛИЧНЫЙ ПРОЕКТ</p><h1>Мой трекер</h1><p>Небольшие шаги к большим делам.</p></header>
<form id="add-form"><label for="new-task">Новая задача</label><div class="entry"><input id="new-task" name="title" autocomplete="off" maxlength="300" placeholder="Что нужно сделать?"><button type="submit">Добавить</button></div></form>
<section class="search-tools" aria-label="Поиск и фильтры"><label for="search">Поиск задач</label><input type="search" id="search" placeholder="Найти по названию"><div class="filters"><button type="button" data-status="all" aria-pressed="true">Все</button><button type="button" data-status="active" aria-pressed="false">Активные</button><button type="button" data-status="completed" aria-pressed="false">Выполненные</button></div></section><p id="visible-count"></p><p id="message" role="status" aria-live="polite"></p><p id="counter"></p><ul id="tasks" aria-label="Задачи"></ul><p id="empty">Пока задач нет. Добавь первую.</p>
<footer>Задачи хранятся только в этом браузере.</footer></main><script type="module" src="./app.js"></script></body></html>
